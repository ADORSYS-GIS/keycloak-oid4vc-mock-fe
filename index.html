<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/adorsys.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keycloak-sso</title>

    <script>
      // Send the old GitHub Pages URL to the datev fork deployment.
      // Only redirect on this host, so self-hosted Docker deployments
      // are left alone.
      const hostname = window.location.hostname;

      if (hostname.endsWith('adorsys-gis.github.io')) {
        const newBase = 'https://adorsys-gis.github.io/keycloak-oid4vc-mock-fe-datev';
        const path = window.location.pathname.replace('/keycloak-oid4vc-mock-fe', '');
        window.location.href = newBase + path + window.location.search + window.location.hash;
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="%BASE_URL%config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
