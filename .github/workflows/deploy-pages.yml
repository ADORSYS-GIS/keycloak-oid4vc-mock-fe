name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_type }}
  cancel-in-progress: true

jobs:
  rebuild:
    env:
      VITE_KEYCLOAK_URL: https://keycloak-demo.solutions.adorsys.com
      VITE_KEYCLOAK_REALM: oid4vc-vci
      VITE_KEYCLOAK_CLIENT_ID: oid4vc-demo-public
      VITE_OID4VC_DEFAULT_CREDENTIAL_CONFIGURATION_ID: DatevCompanyCredential
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "${{ github.ref_name }}" ] || \
            { echo "Tag ${{ github.ref_name }} does not match package.json version v$VERSION"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/keycloak-oid4vc-mock-fe/

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: rebuild

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
