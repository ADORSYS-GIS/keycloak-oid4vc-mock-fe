<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc">
  <title id="title">Credential issuance and revocation sequence diagram</title>
  <desc id="desc">Sequence diagram showing user, mock frontend, Keycloak OID4VC, EUDI wallet, and status list server interactions for credential issuance and revocation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d8e8ff"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9db4ca"/>
    </marker>
    <style>
      .bg { fill: #08111f; }
      .lane { stroke: #d8e8ff; stroke-width: 1.3; opacity: 0.86; }
      .box { fill: #2c2f35; stroke: #d8dbe2; stroke-width: 1; rx: 4; }
      .user { fill: none; stroke: #d8e8ff; stroke-width: 1.3; }
      .label { fill: #eef6ff; font-family: Arial, sans-serif; font-size: 13px; }
      .small { fill: #d8e8ff; font-family: Arial, sans-serif; font-size: 11px; }
      .note { fill: #34363b; opacity: 0.95; }
      .note-text { fill: #d7dee8; font-family: Arial, sans-serif; font-size: 11px; }
      .message { stroke: #d8e8ff; stroke-width: 1.4; marker-end: url(#arrow); }
      .return { stroke: #9db4ca; stroke-width: 1.3; stroke-dasharray: 4 4; marker-end: url(#arrow-muted); }
      .self { fill: none; stroke: #d8e8ff; stroke-width: 1.3; marker-end: url(#arrow); }
      .alt { fill: none; stroke: #9db4ca; stroke-width: 1; stroke-dasharray: 3 3; }
      .step { fill: #f2f6fb; stroke: #1b2737; stroke-width: 1; }
      .step-text { fill: #1b2737; font-family: Arial, sans-serif; font-size: 9px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1040"/>

  <g id="participants">
    <circle class="user" cx="90" cy="24" r="9"/>
    <line class="user" x1="90" y1="33" x2="90" y2="54"/>
    <line class="user" x1="77" y1="42" x2="103" y2="42"/>
    <line class="user" x1="90" y1="54" x2="78" y2="72"/>
    <line class="user" x1="90" y1="54" x2="102" y2="72"/>
    <text class="label" x="90" y="90" text-anchor="middle">User</text>

    <rect class="box" x="290" y="18" width="90" height="38"/>
    <text class="label" x="335" y="42" text-anchor="middle">Mock Frontend</text>

    <rect class="box" x="585" y="18" width="112" height="38"/>
    <text class="label" x="641" y="42" text-anchor="middle">Keycloak / OID4VC</text>

    <rect class="box" x="885" y="18" width="96" height="38"/>
    <text class="label" x="933" y="42" text-anchor="middle">EUDI Wallet</text>

    <rect class="box" x="1010" y="18" width="100" height="38"/>
    <text class="label" x="1060" y="42" text-anchor="middle">Status List Server</text>

    <line class="lane" x1="90" y1="98" x2="90" y2="1168"/>
    <line class="lane" x1="335" y1="56" x2="335" y2="1190"/>
    <line class="lane" x1="641" y1="56" x2="641" y2="1190"/>
    <line class="lane" x1="933" y1="56" x2="933" y2="1190"/>
    <line class="lane" x1="1060" y1="56" x2="1060" y2="1190"/>
  </g>

  <g id="messages">
    <line class="message" x1="90" y1="110" x2="335" y2="110"/>
    <text class="small" x="212" y="101" text-anchor="middle">Open dashboard</text>
    <circle class="step" cx="90" cy="110" r="7"/><text class="step-text" x="90" y="110">1</text>

    <line class="message" x1="335" y1="140" x2="641" y2="140"/>
    <text class="small" x="488" y="131" text-anchor="middle">Authenticate with Keycloak SSO</text>
    <circle class="step" cx="335" cy="140" r="7"/><text class="step-text" x="335" y="140">2</text>

    <line class="return" x1="641" y1="170" x2="335" y2="170"/>
    <text class="small" x="488" y="161" text-anchor="middle">Access token and user profile</text>
    <circle class="step" cx="641" cy="170" r="7"/><text class="step-text" x="641" y="170">3</text>

    <line class="message" x1="335" y1="200" x2="641" y2="200"/>
    <text class="small" x="488" y="191" text-anchor="middle">Request credential offer URI</text>
    <rect class="note" x="320" y="209" width="340" height="22"/>
    <text class="note-text" x="490" y="224" text-anchor="middle">create-credential-offer is tried first, credential-offer-uri is used as fall back</text>
    <circle class="step" cx="335" cy="200" r="7"/><text class="step-text" x="335" y="200">4</text>

    <line class="return" x1="641" y1="250" x2="335" y2="250"/>
    <text class="small" x="488" y="241" text-anchor="middle">Credential offer URI</text>
    <circle class="step" cx="641" cy="250" r="7"/><text class="step-text" x="641" y="250">5</text>

    <rect class="alt" x="180" y="262" width="462" height="220"/>
    <text class="small" x="195" y="276">alt</text>
    <line class="alt" x1="180" y1="326" x2="642" y2="326"/>
    <text class="small" x="505" y="285" text-anchor="middle">[By reference QR (default)]</text>
    <path class="self" d="M335 306 C295 306,295 342,335 342"/>
    <text class="small" x="220" y="306">Build openid-credential-offer URI with credential_offer_uri</text>
    <circle class="step" cx="335" cy="342" r="7"/><text class="step-text" x="335" y="342">6</text>

    <text class="small" x="510" y="348" text-anchor="middle">[By value QR]</text>
    <line class="message" x1="335" y1="380" x2="641" y2="380"/>
    <text class="small" x="488" y="371" text-anchor="middle">Fetch credential offer JSON</text>
    <circle class="step" cx="335" cy="380" r="7"/><text class="step-text" x="335" y="380">7</text>

    <line class="return" x1="641" y1="410" x2="335" y2="410"/>
    <text class="small" x="488" y="401" text-anchor="middle">Credential offer JSON</text>
    <circle class="step" cx="641" cy="410" r="7"/><text class="step-text" x="641" y="410">8</text>

    <path class="self" d="M335 440 C295 440,295 476,335 476"/>
    <text class="small" x="212" y="440">Build openid-credential-offer URI with credential_offer</text>
    <circle class="step" cx="335" cy="476" r="7"/><text class="step-text" x="335" y="476">9</text>

    <line class="return" x1="335" y1="514" x2="90" y2="514"/>
    <text class="small" x="212" y="505" text-anchor="middle">Render selected QR code</text>
    <circle class="step" cx="335" cy="514" r="7"/><text class="step-text" x="335" y="514">10</text>

    <line class="message" x1="90" y1="548" x2="933" y2="548"/>
    <text class="small" x="512" y="539" text-anchor="middle">Scan QR code</text>
    <circle class="step" cx="90" cy="548" r="7"/><text class="step-text" x="90" y="548">11</text>

    <line class="message" x1="933" y1="584" x2="641" y2="584"/>
    <text class="small" x="787" y="575" text-anchor="middle">Resolve offer and request credential</text>
    <circle class="step" cx="933" cy="584" r="7"/><text class="step-text" x="933" y="584">12</text>

    <line class="message" x1="641" y1="620" x2="1060" y2="620"/>
    <text class="small" x="850" y="611" text-anchor="middle">Publish active status for issued credential</text>
    <circle class="step" cx="641" cy="620" r="7"/><text class="step-text" x="641" y="620">13</text>

    <line class="return" x1="1060" y1="654" x2="641" y2="654"/>
    <text class="small" x="850" y="645" text-anchor="middle">Status list updated</text>
    <circle class="step" cx="1060" cy="654" r="7"/><text class="step-text" x="1060" y="654">14</text>

    <line class="return" x1="641" y1="688" x2="933" y2="688"/>
    <text class="small" x="787" y="679" text-anchor="middle">Verifiable credential with status_list claim</text>
    <circle class="step" cx="641" cy="688" r="7"/><text class="step-text" x="641" y="688">15</text>

    <line class="message" x1="90" y1="744" x2="335" y2="744"/>
    <text class="small" x="212" y="735" text-anchor="middle">Open Credentials tab</text>
    <circle class="step" cx="90" cy="744" r="7"/><text class="step-text" x="90" y="744">16</text>

    <line class="message" x1="335" y1="782" x2="641" y2="782"/>
    <text class="small" x="488" y="773" text-anchor="middle">GET issued verifiable credentials</text>
    <circle class="step" cx="335" cy="782" r="7"/><text class="step-text" x="335" y="782">17</text>

    <line class="return" x1="641" y1="816" x2="335" y2="816"/>
    <text class="small" x="488" y="807" text-anchor="middle">Issued credentials for authenticated user</text>
    <circle class="step" cx="641" cy="816" r="7"/><text class="step-text" x="641" y="816">18</text>

    <line class="return" x1="335" y1="850" x2="90" y2="850"/>
    <text class="small" x="212" y="841" text-anchor="middle">Show credentials with active/revoked status</text>
    <circle class="step" cx="335" cy="850" r="7"/><text class="step-text" x="335" y="850">19</text>

    <line class="message" x1="90" y1="884" x2="335" y2="884"/>
    <text class="small" x="212" y="875" text-anchor="middle">Click Revoke</text>
    <circle class="step" cx="90" cy="884" r="7"/><text class="step-text" x="90" y="884">20</text>

    <line class="return" x1="335" y1="916" x2="90" y2="916"/>
    <text class="small" x="212" y="907" text-anchor="middle">Show revocation dialog and require reason</text>
    <circle class="step" cx="335" cy="916" r="7"/><text class="step-text" x="335" y="916">21</text>

    <line class="message" x1="90" y1="948" x2="335" y2="948"/>
    <text class="small" x="212" y="939" text-anchor="middle">Confirm revocation with reason</text>
    <circle class="step" cx="90" cy="948" r="7"/><text class="step-text" x="90" y="948">22</text>

    <line class="message" x1="335" y1="982" x2="641" y2="982"/>
    <text class="small" x="488" y="973" text-anchor="middle">POST revoke with issued_credential_revocation mode</text>
    <circle class="step" cx="335" cy="982" r="7"/><text class="step-text" x="335" y="982">23</text>

    <path class="self" d="M641 1020 C700 1020,700 1050,641 1050"/>
    <text class="small" x="748" y="1016" text-anchor="middle">Validate user, credential ownership, and status mapping</text>
    <circle class="step" cx="641" cy="1050" r="7"/><text class="step-text" x="641" y="1050">24</text>

    <line class="message" x1="641" y1="1086" x2="1060" y2="1086"/>
    <text class="small" x="850" y="1077" text-anchor="middle">Update credential status to revoked</text>
    <circle class="step" cx="641" cy="1086" r="7"/><text class="step-text" x="641" y="1086">25</text>

    <line class="return" x1="1060" y1="1122" x2="641" y2="1122"/>
    <text class="small" x="850" y="1113" text-anchor="middle">Status list updated</text>
    <circle class="step" cx="1060" cy="1122" r="7"/><text class="step-text" x="1060" y="1122">26</text>

    <line class="return" x1="641" y1="1156" x2="335" y2="1156"/>
    <text class="small" x="488" y="1147" text-anchor="middle">Revocation success</text>
    <circle class="step" cx="641" cy="1156" r="7"/><text class="step-text" x="641" y="1156">27</text>

    <line class="return" x1="335" y1="1188" x2="90" y2="1188"/>
    <text class="small" x="212" y="1179" text-anchor="middle">Keep credential visible with status revoked</text>
    <circle class="step" cx="335" cy="1188" r="7"/><text class="step-text" x="335" y="1188">28</text>
  </g>

  <g id="footer">
    <circle class="user" cx="90" cy="1200" r="9"/>
    <line class="user" x1="90" y1="1209" x2="90" y2="1228"/>
    <line class="user" x1="77" y1="1218" x2="103" y2="1218"/>
    <line class="user" x1="90" y1="1228" x2="78" y2="1238"/>
    <line class="user" x1="90" y1="1228" x2="102" y2="1238"/>
    <text class="label" x="90" y="1190" text-anchor="middle">User</text>
    <rect class="box" x="290" y="1194" width="90" height="38"/>
    <text class="label" x="335" y="1218" text-anchor="middle">Mock Frontend</text>
    <rect class="box" x="585" y="1194" width="112" height="38"/>
    <text class="label" x="641" y="1218" text-anchor="middle">Keycloak / OID4VC</text>
    <rect class="box" x="885" y="1194" width="96" height="38"/>
    <text class="label" x="933" y="1218" text-anchor="middle">EUDI Wallet</text>
    <rect class="box" x="1010" y="1194" width="100" height="38"/>
    <text class="label" x="1060" y="1218" text-anchor="middle">Status List Server</text>
  </g>
</svg>
